name: Build and deploy container to Azure Web App - paa-discordapp-linux

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: paa-discordapp-linux
  RESOURCE_GROUP: Paper-Animal-Adventure
  ACR_NAME: paacontainerregistry
  ACR_LOGIN_SERVER: paacontainerregistry.azurecr.io
  IMAGE_NAME: paa-discordapp

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Build image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest .

      - name: Push image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Point Web App to new image
        run: |
          az webapp config container set \
            --name $AZURE_WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP \
            --container-image-name $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Restart Web App
        run: |
          az webapp restart \
            --name $AZURE_WEBAPP_NAME \
            --resource-group $RESOURCE_GROUP
